name: Build EXE
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pyinstaller pillow
      - run: python -m PyInstaller --onefile --windowed --icon gst_icon.ico --add-data "gst_icon.ico;." --name GSTPortal gst_portal_app.py
      - run: python -m PyInstaller --onefile --windowed --icon gst_icon.ico --add-data "gst_icon.ico;." --name GSTStatus gst_app.py
      - name: Installer (setup) banao
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
          Copy-Item Output\GSTPortal_Setup.exe dist\
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: GST Checker v${{ github.run_number }}
          files: |
            dist/GSTPortal_Setup.exe
            dist/GSTPortal.exe
            dist/GSTStatus.exe
